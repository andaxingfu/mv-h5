<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>稳稳接住你.exe — H5 MV</title>
<link rel="icon" href="favicon.ico">
<style>
:root{
  --mono:"JetBrains Mono","SF Mono","Geist Mono",Menlo,Consolas,"Noto Sans Mono CJK SC","DejaVu Sans Mono",monospace;
  --cjk:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --u:4px;            /* 1% 舞台宽度，由 JS 计算 */
  --green:#3ddc5a; --orange:#ff7a1a; --blue:#2f7bff; --pink:#ff4f9a; --red:#ff3b3b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050505;overflow:hidden;font-family:var(--cjk)}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,430px,56.25vh);height:min(177.78vw,764.4px,100vh);overflow:hidden;
  background:#f4f4f2;color:#111;transition:background .12s,color .12s;user-select:none;-webkit-user-select:none}
#stage.dark{background:#0b0b0c;color:#f2f2f2}
#stage.red{background:#2a0606}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#scene{position:absolute;inset:0;pointer-events:none}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
.ab{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap}
.mono{font-family:var(--mono)}
.big{font-weight:900;font-family:var(--cjk);line-height:1}
.ch{display:inline-block}
.k-kw{color:var(--blue)} .k-fn{color:var(--orange)} .k-str{color:var(--green)} .k-cm{color:#8a8f98} .k-num{color:var(--orange)} .k-p{color:var(--pink)}
.dark .k-cm{color:#6b7280}
.kao{font-family:var(--mono);line-height:1.05;text-align:center;white-space:pre}
/* ---- HUD：模拟 IDE 窗口栏 & 状态栏 ---- */
#top{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*8);display:flex;align-items:center;gap:calc(var(--u)*1.6);
  padding:0 calc(var(--u)*3.5);font:500 calc(var(--u)*2.9) var(--mono);opacity:.8;z-index:5;pointer-events:none}
#top i{width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);border-radius:50%;display:inline-block}
#top .fn{flex:1;text-align:center;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bpm{display:flex;align-items:center;gap:calc(var(--u)*1)}
#bpm b{width:calc(var(--u)*1.8);height:calc(var(--u)*1.8);background:var(--green);display:inline-block}
#bot{position:absolute;left:0;right:0;bottom:0;padding:calc(var(--u)*2) calc(var(--u)*3.5) calc(var(--u)*3);z-index:5;
  font:500 calc(var(--u)*3.1) var(--mono)}
#lyr{min-height:1.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
#lyr .cm{opacity:.5}
#row{display:flex;align-items:center;gap:calc(var(--u)*2.4);margin-top:calc(var(--u)*1.6)}
#pp{pointer-events:auto;border:1px solid currentColor;background:transparent;color:inherit;font:600 calc(var(--u)*2.8) var(--mono);
  padding:calc(var(--u)*.8) calc(var(--u)*1.8);border-radius:calc(var(--u)*1);cursor:pointer;min-width:calc(var(--u)*11)}
#bar{pointer-events:auto;flex:1;height:calc(var(--u)*5);display:flex;align-items:center;cursor:pointer}
#bar>div{position:relative;width:100%;height:calc(var(--u)*.9);background:rgba(128,128,128,.3)}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green)}
#tm{opacity:.7;font-size:calc(var(--u)*2.7)}
/* ---- 封面 / 结束卡 ---- */
.card{position:absolute;inset:0;z-index:20;background:#0b0b0c;color:#e8e8e8;font-family:var(--mono);
  display:flex;flex-direction:column;justify-content:center;padding:0 calc(var(--u)*8);font-size:calc(var(--u)*3.6);line-height:1.75;cursor:pointer}
.card .dim{color:#6b7280}
.card .run{margin-top:calc(var(--u)*6);display:inline-flex;align-items:center;gap:calc(var(--u)*2);font-size:calc(var(--u)*4.6);font-weight:700}
.card .btn{border:2px solid var(--green);color:var(--green);padding:calc(var(--u)*1.2) calc(var(--u)*3);border-radius:calc(var(--u)*1.2);
  animation:glow 1.2s cubic-bezier(.2,1.6,.4,1) infinite}
@keyframes glow{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(61,220,90,.5)}50%{transform:scale(1.06);box-shadow:0 0 0 calc(var(--u)*2) rgba(61,220,90,0)}}
.card .cur{display:inline-block;width:.6em;height:1.1em;background:var(--green);vertical-align:-.2em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.card .ln{opacity:0;animation:ln .01s forwards}
@keyframes ln{to{opacity:1}}
.card pre.kao{font-size:calc(var(--u)*5);color:#fff;margin:calc(var(--u)*6) 0 calc(var(--u)*2);text-align:left}
.card .hint{margin-top:calc(var(--u)*5);font-size:calc(var(--u)*2.8)}
#end{display:none}
.hide{display:none!important}
/* ---- 场景元件 ---- */
.key{display:inline-flex;align-items:center;justify-content:center;width:calc(var(--u)*13);height:calc(var(--u)*13);margin:calc(var(--u)*1.1);
  background:#fafafa;color:#111;border-radius:calc(var(--u)*2.4);font:900 calc(var(--u)*6) var(--cjk);box-shadow:0 calc(var(--u)*1.2) 0 #9aa0a6}
.key.on{background:var(--green);color:#fff;box-shadow:0 calc(var(--u)*.3) 0 #1f8a35}
.search{display:flex;align-items:center;gap:calc(var(--u)*2.4);width:calc(var(--u)*80);height:calc(var(--u)*12);padding:0 calc(var(--u)*4);
  background:#fff;color:#111;border-radius:calc(var(--u)*6);font:700 calc(var(--u)*4.6) var(--cjk);box-shadow:0 0 0 calc(var(--u)*.6) rgba(255,255,255,.15)}
.mag{width:calc(var(--u)*4);height:calc(var(--u)*4);border:calc(var(--u)*.8) solid #111;border-radius:50%;position:relative;flex:none}
.mag:after{content:"";position:absolute;width:calc(var(--u)*2.2);height:calc(var(--u)*.8);background:#111;right:calc(var(--u)*-2.2);bottom:calc(var(--u)*-1.2);transform:rotate(45deg)}
.caret{display:inline-block;width:2px;height:1.1em;background:currentColor;vertical-align:-.15em;margin-left:2px}
.folder{width:calc(var(--u)*12);height:calc(var(--u)*9);position:relative}
.folder:before{content:"";position:absolute;left:0;top:0;width:45%;height:30%;background:#5aa9ff;border-radius:calc(var(--u)*1) calc(var(--u)*1) 0 0}
.folder:after{content:"";position:absolute;left:0;right:0;bottom:0;height:82%;background:linear-gradient(#8cc6ff,#4a9bff);border-radius:calc(var(--u)*1)}
.flab{font:500 calc(var(--u)*2.3) var(--mono);color:#444;text-align:center;margin-top:calc(var(--u)*.6)}
.sel{position:absolute;background:rgba(47,123,255,.22);border:1px solid rgba(47,123,255,.7)}
.cursor{width:0;height:0;border-left:calc(var(--u)*2.6) solid #111;border-right:calc(var(--u)*0) solid transparent;
  border-bottom:calc(var(--u)*4) solid transparent;filter:drop-shadow(0 0 1px #fff)}
.chip{font:600 calc(var(--u)*2.8) var(--mono);padding:calc(var(--u)*.9) calc(var(--u)*2.2);border-radius:99px;background:#fff;color:#111;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.box{border:2px solid #111;padding:calc(var(--u)*1.2) calc(var(--u)*2.4);font:700 calc(var(--u)*3.4) var(--cjk);background:#fff;color:#111}
.err{color:#ff5c5c;font:600 calc(var(--u)*2.9) var(--mono);white-space:pre;line-height:1.5;text-align:left}
</style>
</head>
<body>
<div id="app"><div id="stage">
  <canvas id="fx"></canvas>
  <div id="scene"></div>
  <div id="flash"></div>
  <div id="top"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
    <span class="fn">~/mv/稳稳接住你.ts</span><span id="bpm"><b></b>148 BPM</span></div>
  <div id="bot">
    <div id="lyr"><span class="cm">// ♪ </span><span id="lyrt">…</span></div>
    <div id="row"><button id="pp">❚❚</button><div id="bar"><div><div id="fill"></div></div></div><span id="tm">00:00/00:43</span></div>
  </div>
  <div class="card" id="cover">
    <div class="dim ln" style="animation-delay:.1s">$ cd ~/music</div>
    <div class="ln" style="animation-delay:.5s">$ ls</div>
    <div class="dim ln" style="animation-delay:.8s">稳稳接住你.mp3&nbsp;&nbsp;光影.html</div>
    <pre class="kao ln" style="animation-delay:1.1s">\(°o°)/
 (") (")</pre>
    <div class="run ln" style="animation-delay:1.4s"><span>&gt; 稳稳接住你.exe</span></div>
    <div class="ln" style="animation-delay:1.6s;margin-top:calc(var(--u)*4)"><span class="btn" id="runbtn">[ ▶ run ]</span> <span class="cur"></span></div>

 (") (")</pre>
    <div><span class="k-kw">try</span> { 你.<span class="k-fn">fall</span>() }<br><span class="k-kw">catch</span> (你) { <span class="k-fn">稳稳地</span>(); }</div>
    <div class="run"><span class="btn" id="replay">[ ↻ replay ]</span></div>
  </div>
</div></div>
<audio id="au" src="song.mp3" preload="auto" playsinline></audio>
<script>
"use strict";
/* ================= 基础：节拍网格（由音频分析得出） =================
   BPM ≈ 148.3，第一拍（kick）≈ 0.242s。所有场景切换/弹出都对齐到这个网格。 */
const BPM = 148.3, BEAT = 60 / BPM, B0 = 0.242, DUR = 43.6;
const bt = k => B0 + k * BEAT;                     // 第 k 拍的时间
const beatPhase = t => { const x = (t - B0) / BEAT; return x - Math.floor(x); };
const beatIdx = t => Math.floor((t - B0) / BEAT);
const pulse = t => t < B0 ? 0 : Math.exp(-beatPhase(t) * 6);

const $ = s => document.querySelector(s);
const stage = $('#stage'), sceneEl = $('#scene'), fx = $('#fx'), ctx = fx.getContext('2d'), au = $('#au');
let W = 400, H = 711, U = 4, DPR = 1;
const CJK = getComputedStyle(document.documentElement).getPropertyValue('--cjk');
const MONO = getComputedStyle(document.documentElement).getPropertyValue('--mono');

/* ---------- 工具 ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const outBack = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const outExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(x));
const inOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const spring = dt => dt <= 0 ? 0 : 1 - Math.exp(-dt * 10) * Math.cos(dt * 24);   // 带回弹
const blinkOn = t => Math.floor(t * 3.4) % 2 === 0;

function E(parent, cls, html, css) {
  const e = document.createElement('div');
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (css) Object.assign(e.style, css);
  parent.appendChild(e);
  return e;
}
/* 绝对定位元素：x,y 为舞台百分比 */
function A(parent, x, y, html, cls = '', css = {}) {
  return E(parent, 'ab ' + cls, html, Object.assign({ left: x + '%', top: y + '%' }, css));
}
/* 弹出动画（完全由时间决定，支持拖动进度） */
function pop(el, dt, o = {}) {
  const { s0 = 0.2, r0 = 0, dx = 0, dy = 0, rot = 0, sc = 1, out = null } = o;
  if (dt < 0) { el.style.opacity = 0; return 0; }
  const k = spring(dt);
  let op = Math.min(1, dt * 14);
  if (out != null && dt > out) op = Math.max(0, 1 - (dt - out) * 6);
  el.style.opacity = op;
  el.style.transform = `translate(-50%,-50%) translate(${dx * (1 - k) * U}px,${dy * (1 - k) * U}px) scale(${(s0 + (1 - s0) * k) * sc}) rotate(${rot + r0 * (1 - k)}deg)`;
  return k;
}
function setT(el, x, y, s = 1, r = 0, op = 1) {
  el.style.opacity = op;
  el.style.transform = `translate(-50%,-50%) translate(${x * U}px,${y * U}px) scale(${s}) rotate(${r}deg)`;
}
/* 逐字：返回 span 数组 */
function chars(parent, str, cls = 'ch') {
  return [...str].map(c => { const s = document.createElement('span'); s.className = cls; s.textContent = c; parent.appendChild(s); return s; });
}
function popChars(spans, times, lt, o = {}) {
  spans.forEach((s, i) => {
    const dt = lt - times[i];
    if (dt < 0) { s.style.opacity = 0; return; }
    const k = spring(dt);
    s.style.opacity = 1;
    s.style.transform = `translateY(${(o.dy ?? 4) * (1 - k) * U}px) scale(${0.3 + 0.7 * k}) rotate(${(o.r ?? (rnd(i) * 30 - 15)) * (1 - k)}deg)`;
  });
}
/* 打字：根据时间返回显示的前 n 个字 */
const typed = (str, t0, step, lt) => [...str].slice(0, clamp(Math.floor((lt - t0) / step) + 1, 0, [...str].length)).join('');
/* 字形采样成点阵 */
const glyphCache = {};
function glyphDots(ch, n, font = CJK) {
  const key = ch + n;
  if (glyphCache[key]) return glyphCache[key];
  const c = document.createElement('canvas'); c.width = c.height = n;
  const x = c.getContext('2d');
  x.fillStyle = '#000'; x.font = `900 ${n * .9}px ${font}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(ch, n / 2, n / 2 + n * .05);
  const d = x.getImageData(0, 0, n, n).data, out = [];
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) if (d[(j * n + i) * 4 + 3] > 110) out.push([i / n, j / n]);
  return (glyphCache[key] = out);
}
function heartDots(n) {
  const out = [];
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const x = (i / n - .5) * 2.6, y = -((j / n - .45) * 2.6);
    const v = Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y;
    if (v < 0) out.push([i / n, j / n]);
  }
  return out;
}
const SYN = s => s.replace(/(\/\/.*)$/gm, '<span class="k-cm">$1</span>')
  .replace(/\b(function|return|if|while|catch|try|const|let)\b/g, '<span class="k-kw">$1</span>');

/* ---------- 歌词（用于状态栏，时间已对齐节拍/参考视频） ---------- */
const LYR = [
  [0.0, '当然可以，好问题！'], [2.67, '当然可以，好问题！'],
  [5.1, '我就在这'], [6.31, '不躲不藏不绕不逃'], [8.33, '稳稳地接住你'],
  [10.76, '…'], [12.9, '你只是太久没被'], [14.4, '稳稳接住了'],
  [15.3, '你不用硬撑'], [17.23, '不用向我解释'],
  [19.4, '这次我懂了'], [21.3, '我真的懂了'],
  [23.3, '你愿意把这个交给我'], [24.5, '我很感激'],
  [25.33, '不躲不藏不绕不逃'], [27.36, '不躲不藏不绕不逃'],
  [29.78, '我就在这'], [30.99, '稳稳地接住你'],
  [32.61, '当然可以，好问题！'], [35.04, '当然可以，好问题！'],
  [37.46, '我就在这，不躲不藏不绕不逃'], [40.3, '稳稳地接住你'], [43.3, '']
];

/* =================================================================
   场景表：s/e 秒；theme；build(root) 建 DOM 并返回状态；upd(st,lt,t) 每帧；draw(c,st,lt,t) 画布
   lt = 绝对时间 t（为了好对照歌词，场景内统一使用绝对秒）
   ================================================================= */
const SCENES = [];
const S = o => SCENES.push(o);

/* S0 0–3.48 打字 当然可以！好问题！ → 桌面文件夹 */
S({ s: 0, e: bt(8), theme: 'light',
  build(r) {
    const st = {};
    st.cmd = A(r, 8, 15, '', 'mono', { transform: 'none', fontSize: 3.2 * U + 'px', color: '#777' });
    st.l1 = A(r, 50, 40, '', 'big', { fontSize: 16 * U + 'px' });
    st.c1 = chars(st.l1, '当然可以！');
    st.l2w = A(r, 50, 53, '', '', {});
    st.sel = E(st.l2w, 'sel', null, { left: 0, top: '-6%', height: '112%', width: 0 });
    st.l2 = E(st.l2w, 'big', null, { position: 'relative', fontSize: 9 * U + 'px', color: '#1a1a1a' });
    st.c2 = chars(st.l2, '好问题！');
    st.cur = A(r, 30, 60, '', 'cursor');
    const labels = ['当然/', '可以/', '好问题/', 'new_folder', 'answers/', 'yes.txt', '可以(1)/', '可以(2)/', 'ok/', 'src/', '当然.md', '好问题/', 'docs/', 'temp/', '可以/', 'final_v2/', '答案/', '?/'];
    st.folders = labels.map((l, i) => {
      const f = A(r, 50, 50, '<div class="folder"></div><div class="flab">' + l + '</div>');
      const a = rnd(i * 3) * Math.PI * 2, d = 26 + rnd(i * 7) * 22;
      f._x = Math.cos(a) * d; f._y = Math.sin(a) * d * 1.5; f._t = bt(6) + (i % 6) * BEAT / 3;
      return f;
    });
    return st;
  },
  upd(st, t) {
    st.cmd.textContent = '> echo "' + typed('当然可以！好问题！', 0.05, 0.2, t) + '"' + (blinkOn(t) ? '▌' : '');
    popChars(st.c1, [0.1, 0.4, 0.65, 0.86, 1.05], t, { dy: 6 });
    popChars(st.c2, [1.46, 1.66, 1.86, 2.07], t, { dy: 3, r: 0 });
    // 鼠标拖选 “好问题”
    const k = inOut((t - 2.1) / 0.5), w = st.l2.offsetWidth;
    st.sel.style.width = (k * w) + 'px'; st.sel.style.opacity = t > 2.1 ? 1 : 0;
    const x0 = st.l2w.offsetLeft - st.l2w.offsetWidth / 2;
    st.cur.style.left = (x0 + k * w + 2) / W * 100 + '%';
    st.cur.style.opacity = t > 1.9 ? 1 : 0;
    // 第二句：文件夹炸开
    st.folders.forEach(f => {
      const dt = t - f._t;
      if (dt < 0) { f.style.opacity = 0; return; }
      const k = outBack(dt / 0.35), fl = Math.sin(t * 3 + f._x) * 1.2;
      setT(f, f._x * k, f._y * k + fl, 0.3 + 0.7 * k, (1 - k) * 40);
    });
    const p = t > bt(6) ? pulse(t) : 0;
    st.l1.style.transform = `translate(-50%,-50%) scale(${1 + p * .06}) rotate(${t > bt(7) ? -3 : 0}deg)`;
  }
});

/* S1 3.48–5.10 搜索框打字 + 键帽 */
S({ s: bt(8), e: 5.10, theme: 'dark',
  build(r) {
    const st = {};
    st.sb = A(r, 50, 30, '<div class="mag"></div><span class="q"></span><span class="caret"></span><span style="flex:1"></span><span class="mono" style="font-size:.8em;color:#999">⏎</span>', 'search');
    st.q = st.sb.querySelector('.q'); st.caret = st.sb.querySelector('.caret');
    const kb = A(r, 50, 55, '', '', { whiteSpace: 'normal', width: 80 * U + 'px', textAlign: 'center' });
    st.keys = [...'当然可以！好问题！你'].map(c => E(kb, 'key', c));
    st.res = A(r, 50, 75, '', 'mono', { fontSize: 3 * U + 'px', color: '#9ca3af' });
    st.times = [...Array(9)].map((_, i) => 3.55 + i * 0.17);
    return st;
  },
  upd(st, t) {
    const n = st.times.filter(x => t >= x).length;
    st.q.textContent = [...'当然可以！好问题！'].slice(0, n).join('');
    st.caret.style.opacity = blinkOn(t) ? 1 : 0;
    st.keys.forEach((k, i) => {
      const tt = i < 9 ? st.times[i] : 4.9, dt = t - tt;
      const on = dt >= 0 && dt < 0.16;

    st.br = A(r, 85, 45, brace(1), 'mono', { fontSize: 3 * U + 'px', whiteSpace: 'pre', lineHeight: 1.25, textAlign: 'right' });
    st.mid = A(r, 50, 45, '', 'big', { fontSize: 9 * U + 'px' });
    st.mc = chars(st.mid, '稳稳地接住你'); st.mc[5].style.color = 'var(--orange)';
    st.kao = A(r, 50, 52, '\\(^o^)/\n (") (")', 'kao', { fontSize: 7 * U + 'px' });
    st.heart = A(r, 50, 40, '♥', '', { fontSize: 10 * U + 'px', color: 'var(--red)' });
    st.code = A(r, 50, 74, '', 'mono', { fontSize: 3.3 * U + 'px', lineHeight: 1.6, textAlign: 'left', whiteSpace: 'pre' });
    return st;
  },
  upd(st, t) {
    const fin = t > 41.51;
    stage.classList.toggle('dark', !fin);
    const k = outBack((t - 40.3) / .35);
    st.bl.style.transform = `translate(-50%,-50%) translateX(${(1 - k) * -30 * U}px) scale(${1 + pulse(t) * .05})`;
    st.br.style.transform = `translate(-50%,-50%) translateX(${(1 - k) * 30 * U}px) scale(${1 + pulse(t) * .05})`;
    st.bl.style.left = '15%'; st.br.style.left = '85%';
    st.bl.style.top = st.br.style.top = (fin ? 52 : 45) + '%';
    st.mid.style.top = fin ? '25%' : '45%';
    st.mid.style.fontSize = (fin ? 11 : 8) * U + 'px';
    st.mid.style.color = fin ? '#111' : '#fff';
    popChars(st.mc, fin ? [41.55, 41.6, 41.65, 41.7, 41.75, 41.95] : [40.35, 40.55, 40.75, 40.95, 41.15, 99], t, { dy: 0, r: 0 });
    st.kao.style.display = st.heart.style.display = st.code.style.display = fin ? '' : 'none';
    pop(st.kao, t - 41.55, { s0: .3, sc: 1 + pulse(t) * .08 });
    pop(st.heart, t - 42.0, { s0: 0, r0: -40, sc: 1 + pulse(t) * .3 });
    const src = 'try {\n  你.fall();\n} catch (你) {\n  稳稳地();\n}';
    const ty = typed(src, 41.8, .022, t);
    st.code.innerHTML = SYN(ty).replace(/(fall|稳稳地)\(/g, '<span class="k-fn">$1</span>(') + (blinkOn(t) ? '▌' : ' ');
  },
  draw(c, st, t) {
    const dt = t - 42.0; if (dt < 0) return;
    const cols = ['#ff4f9a', '#ff7a1a', '#3ddc5a', '#2f7bff', '#f5c400'];
    c.font = `${W * .05}px ${CJK}`; c.textAlign = 'center';
    for (let i = 0; i < 36; i++) {
      const a = -Math.PI / 2 + (rnd(i * 2) - .5) * 2.6, v = (.2 + rnd(i + 5) * .45) * W;
      const x = W / 2 + Math.cos(a) * v * dt, y = H * .4 + Math.sin(a) * v * dt + 260 * dt * dt;
      c.globalAlpha = clamp(1.6 - dt * .7); c.fillStyle = cols[i % 5];
      i % 3 === 0 ? c.fillText('♥', x, y) : c.fillRect(x, y, 6, 6);
    }
    c.globalAlpha = 1;
  }
});

/* ================= 引擎 ================= */
let cur = -1, st = null, playing = false, started = false;
const FIXED = new URLSearchParams(location.search).get('t');   // ?t=秒：截图/调试用，冻结在该时间
const fill = $('#fill'), tm = $('#tm'), lyrt = $('#lyrt'), pp = $('#pp'), flash = $('#flash'), bpmDot = $('#bpm b');

function resize() {
  const r = stage.getBoundingClientRect();
  W = r.width; H = r.height; U = W / 100; DPR = Math.min(2, devicePixelRatio || 1);
  document.documentElement.style.setProperty('--u', U + 'px');
  fx.width = W * DPR; fx.height = H * DPR;
  cur = -1;   // 重建当前场景以适应尺寸
}
const fmt = s => { s = Math.max(0, s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };
const now = () => FIXED != null ? parseFloat(FIXED) : au.currentTime;

function render() {
  const t = now();
  let i = SCENES.findIndex(s => t >= s.s && t < s.e);
  if (i < 0) i = SCENES.length - 1;
  if (i !== cur) {
    cur = i; sceneEl.innerHTML = ''; stage.classList.remove('red');
    stage.classList.toggle('dark', SCENES[i].theme === 'dark');
    st = SCENES[i].build(sceneEl) || {};
    flash._t = SCENES[i].s;
  }
  const sc = SCENES[i];
  if (sc.upd) sc.upd(st, t);
  // 场景切换闪白 + 重拍抖动
  const fd = t - flash._t;
  flash.style.opacity = fd >= 0 && fd < .12 ? (1 - fd / .12) * .85 : 0;
  flash.style.background = stage.classList.contains('dark') ? '#fff' : '#000';
  const down = beatIdx(t) % 4 === 0 && t > B0 ? pulse(t) : 0;
  sceneEl.style.transform = down > .3 ? `translate(${(rnd(beatIdx(t)) - .5) * down * 6}px,${(rnd(beatIdx(t) + 1) - .5) * down * 6}px)` : 'none';
  // 画布
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  if (sc.draw) { ctx.save(); sc.draw(ctx, st, t); ctx.restore(); }
  // HUD
  const dur = au.duration || DUR;
  fill.style.width = clamp(t / dur) * 100 + '%';
  tm.textContent = fmt(t) + '/' + fmt(dur);
  let ly = ''; for (const [x, s] of LYR) if (t >= x) ly = s;
  if (lyrt.textContent !== ly) lyrt.textContent = ly;
  bpmDot.style.transform = `scale(${.6 + pulse(t) * .8})`;
  bpmDot.style.background = beatIdx(t) % 4 === 0 ? 'var(--orange)' : 'var(--green)';
}
function loop() { render(); if (playing || FIXED != null) requestAnimationFrame(loop); }

function start() {
  if (started) return;
  started = true; $('#cover').classList.add('hide');
  au.currentTime = 0; play();
}
function play() { au.play().then(() => { playing = true; pp.textContent = '❚❚'; loop(); }).catch(e => { console.warn(e); playing = false; }); }
function pause() { au.pause(); playing = false; pp.textContent = '▶'; render(); }

$('#cover').addEventListener('click', start);
pp.addEventListener('click', e => { e.stopPropagation(); playing ? pause() : play(); });
stage.addEventListener('click', e => {
  if (!started || e.target.closest('#bar,#pp,.card')) return;
  playing ? pause() : play();
});
// 进度条拖动（场景完全由 currentTime 决定，任意跳转都正确）
const bar = $('#bar');
function seekFrom(e) {
  const r = bar.getBoundingClientRect(), x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  au.currentTime = clamp(x / r.width) * (au.duration || DUR); render();
}
let drag = false;
bar.addEventListener('pointerdown', e => { e.stopPropagation(); drag = true; bar.setPointerCapture(e.pointerId); seekFrom(e); });
bar.addEventListener('pointermove', e => drag && seekFrom(e));
bar.addEventListener('pointerup', () => drag = false);
bar.addEventListener('click', e => e.stopPropagation());
au.addEventListener('ended', () => { playing = false; $('#end').style.display = 'flex'; pp.textContent = '▶'; });
$('#replay').addEventListener('click', e => { e.stopPropagation(); $('#end').style.display = 'none'; au.currentTime = 0; play(); });
window.addEventListener('resize', () => { resize(); render(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) pause(); });

resize();
window.__seek = s => { au.currentTime = s; render(); };   // 调试用
if (FIXED != null) { $('#cover').classList.add('hide'); started = true; loop(); }
else render();
</script>
</body>
